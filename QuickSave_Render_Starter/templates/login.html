{% extends "base.html" %}
{% block title %}Admin login — QuickSave{% endblock %}
{% block content %}
<main class="admin-shell login-shell">
  <div class="panel login-panel">
    <div class="panel-kicker">PRIVATE AREA</div><h1>Admin sign in</h1><p class="muted">Sign in to manage links and view website statistics.</p>
    <form method="post" class="form-stack">
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <a class="back-link" href="{{ url_for('home') }}">← Back to website</a>
  </div>
</main>
{% endblock %}
