{% extends "base.html" %}
{% block title %}Change password — QuickSave Admin{% endblock %}
{% block content %}
<main class="admin-shell">
  <div class="admin-heading"><div><div class="panel-kicker">CONTROL PANEL</div><h1>Change admin password</h1><p class="muted">Use a strong password that you do not use elsewhere.</p></div></div>
  <nav class="admin-nav"><a href="{{ url_for('admin_dashboard') }}">Overview</a><a href="{{ url_for('admin_links') }}">Manage links</a><a href="{{ url_for('admin_settings') }}">Website settings</a><a class="active" href="{{ url_for('admin_password') }}">Change password</a></nav>
  <form method="post" class="panel settings-form"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password <small>At least 12 characters</small><input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label><button class="btn primary" type="submit">Update password</button></form>
</main>
{% endblock %}
